<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Neayou Logo Icon Mark (Graduation Cap + Letter N) -->
  <g id="neayou-logo-mark">
    <!-- Graduation Cap (Dark Charcoal) -->
    <g id="graduation-cap" fill="none" stroke="#2B303A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <!-- Roof Diamond -->
      <polygon points="200,45 315,85 200,125 85,85" />
      
      <!-- Skullcap Base -->
      <path d="M 135 105 L 135 142 Q 200 172 265 142 L 265 105" />
      
      <!-- Tassel String -->
      <path d="M 200 85 L 300 95 L 305 132" stroke-width="9" />
      
      <!-- Tassel Ring Knot -->
      <circle cx="305" cy="140" r="6" fill="#2B303A" stroke="none" />
      
      <!-- Tassel Drop / Bell -->
      <path d="M 299 148 L 311 148 L 315 170 Q 305 174 295 170 Z" fill="#2B303A" stroke="none" />
    </g>

    <!-- Stylized Letter N (Vibrant Green) -->
    <path id="letter-n" 
          d="M 135 292 L 135 162 L 265 292 L 265 162" 
          fill="none" 
          stroke="#45AC5E" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
